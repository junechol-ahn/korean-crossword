# main 브랜치에 push 하면: 테스트 → (처음이면 Fly 앱·디스크 생성) → Fly.io 배포
name: Test and deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check FLY_API_TOKEN secret
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN 저장소 시크릿이 없습니다. README의 '처음 한 번 설정' 을 따라 등록해 주세요."
            exit 1
          fi

      - name: Create Fly app if missing
        run: |
          APP=$(grep -E '^app *=' fly.toml | sed -E 's/^app *= *"([^"]+)".*/\1/')
          echo "APP=$APP" >> "$GITHUB_ENV"
          if flyctl status --app "$APP" > /dev/null 2>&1; then
            echo "앱 $APP 이 이미 있습니다."
          else
            echo "앱 $APP 을 만듭니다 (조직: $FLY_ORG)."
            flyctl apps create "$APP" --org "$FLY_ORG"
          fi

      - name: Create volume if missing
        run: |
          if flyctl volumes list --app "$APP" --json | grep -Eq '"name": *"crossword_data"'; then
            echo "디스크 crossword_data 가 이미 있습니다."
          else
            flyctl volumes create crossword_data --app "$APP" --region nrt --size 1 --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
