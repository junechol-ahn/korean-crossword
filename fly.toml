# Fly.io 설정 — 낱말 크로스워드
# 배포는 GitHub Actions(.github/workflows/fly-deploy.yml)가 main 브랜치 push 때마다 실행한다.
app = "korean-crossword"
primary_region = "nrt"          # Fly.io에는 서울 리전이 없어 가장 가까운 도쿄 사용
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  PORT = "8080"
  CROSSWORD_DATA = "/data"
  TRUST_PROXY = "fly"

# SQLite DB를 보관하는 디스크 (재시작·재배포해도 유지)
[[mounts]]
  source = "crossword_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # 접속이 없으면 서버를 멈춰 비용 절약 (다음 접속 때 자동 시작)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# SQLite 파일 하나를 쓰므로 서버는 반드시 1대만
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
